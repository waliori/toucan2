# Left half = central: talks to the right half and to the host (USB or up to 5 BT profiles).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# the BLE battery proxy service does not compile with GCC 15 on the v0.3 line; the Prospector
# scanner gets the right half's level from the status advertisement instead
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# sleep like beekeeb's build: deep sleep after 60 min idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# trackpad events relayed from the right half
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# accent macros fire back-to-back
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=0
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=5

# Prospector in scanner mode: broadcast layer / batteries / modifiers / profile in BLE advertisements.
# On the ZMK v0.3 line the module's piggyback path fails while the keyboard is not connected ("Too big
# advertising data", harmless) and it can disturb pairing of NEW hosts (t-ogura issue #7): pair every
# host first; if a new host will not pair, build once with =n, pair, then switch back.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Toucan"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"

# nice!view status screen style (beekeeb's nice_view_gem shield)
CONFIG_TOUCAN_STATUS_SCREEN=2

# a host that forgot the keyboard may pair again even if the keyboard still holds old keys for it
# (ZMK's BTclr only unpairs when the profile still remembers the host address; stale keys otherwise
# make every new pairing fail with "authentication failure" until a settings reset)
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# ZMK's Kconfig makes the option above imply passkey entry (hosts then ask for a code typed on the
# keyboard, and BlueZ's passkey path fails); keep Just Works like beekeeb's build
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

