# Dongle is USB powered: never sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=300000

# show the halves' battery on the Prospector screen (fetching only; the BLE proxy
# service is useless on a USB dongle and does not compile with GCC 15)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# Prospector screen. The ambient light sensor on this unit does not answer on I2C
# (APDS9960 "power on bit not set" every 100 ms), so fixed brightness.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=70

# trackpad events relayed from the right half
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# accent macros fire back-to-back
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=0
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=5

# live key feed for trainer/: second USB serial port carrying "K <pos> <1|0>" / "L <layer> <1|0>" lines
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_KEY_FEED=y
# keep ZMK's own debug chatter off the feed port
CONFIG_ZMK_LOGGING_MINIMAL=y
