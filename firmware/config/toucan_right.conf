# Right half = peripheral: key matrix + Azoteq trackpad, forwarded to the left half.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# beekeeb's Azoteq driver uses tan(): needs a libc with libm (the minimal libc has none)
CONFIG_NEWLIB_LIBC=y
